name: Build Android APK & Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Android SDK Environment
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        mkdir -p android
        echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

    - name: Prepare Android Assets
      run: |
        mkdir -p android/app/src/main/assets
        cp -a ./*.html android/app/src/main/assets/ || true
        cp -a ./*.css android/app/src/main/assets/ || true
        cp -a ./*.js android/app/src/main/assets/ || true
        cp -a ./*.json android/app/src/main/assets/ || true
        cp -a ./*.png android/app/src/main/assets/ || true
        cp -a ./*.jpg android/app/src/main/assets/ || true
        cp explore.js android/app/src/main/assets/ || true

    - name: Ensure Permanent Keystore Exists
      working-directory: ./android/app
      run: |
        if [ ! -f "mindfocus.keystore" ]; then
          echo "Generating permanent release keystore..."
          keytool -genkeypair -v \
            -keystore mindfocus.keystore \
            -alias mindfocus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "mindfocus123" \
            -keypass "mindfocus123" \
            -dname "CN=MindFocus, OU=BooksTracker, O=MindFocus, L=Delhi, ST=DL, C=IN"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mindfocus.keystore
          git commit -m "Add permanent release keystore for seamless updates [skip ci]" || true
          git push origin main || true
        else
          echo "Permanent release keystore already present."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Standalone APK with Gradle
      working-directory: ./android
      run: |
        gradle assembleRelease --stacktrace --info

    - name: Locate and Rename APK
      run: |
        find android/app/build/outputs/apk/ -name "*.apk"
        cp $(find android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1) MindFocusBooks-Native.apk || cp $(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1) MindFocusBooks-Native.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MindFocusBooks-Native-APK
        path: MindFocusBooks-Native.apk

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Build Windows Executables (Installer + Portable)
      run: npx electron-builder --win --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Locate Windows Executables
      shell: bash
      run: |
        ls -la dist-desktop/

    - name: Upload Windows Executables Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MindFocusBooks-Windows-Executables
        path: dist-desktop/*.exe

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Android Artifact
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: MindFocusBooks-Native-APK
        path: ./artifacts/

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: MindFocusBooks-Windows-Executables
        path: ./artifacts/

    - name: Display Artifacts
      run: |
        mkdir -p ./artifacts
        ls -la ./artifacts/

    - name: Commit Latest APK to Main
      run: |
        if [ -f "./artifacts/MindFocusBooks-Native.apk" ]; then
          cp ./artifacts/MindFocusBooks-Native.apk ./MindFocusBooks-Native.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MindFocusBooks-Native.apk
          git commit -m "Update standalone release APK binary [skip ci]" || true
          git push origin main || true
        fi

    - name: Determine Release Tag and Title
      id: get_tag
      run: |
        TAG=$(node -e "const c = require('./remote-config.json'); console.log((c.activeRelease && c.activeRelease.version) || (c.latest && c.latest.version) || (c.latest_version ? 'v'+c.latest_version : 'v0.0.93'));")
        NAME=$(node -e "const c = require('./remote-config.json'); console.log((c.activeRelease && c.activeRelease.name) || (c.latest && c.latest.name) || ('Mind Focus Books ' + '$TAG'));")
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: ${{ steps.get_tag.outputs.name }}
        body: |
          ### 🚀 Mind Focus Books v0.0.93 Released!

          #### 💻 Windows Desktop Edition (Laptop / PC)
          - **Setup Installer**: `MindFocusBooks-Setup-v0.0.93.exe` (Complete Windows installer with desktop and start menu shortcuts)
          - **Portable Executable**: `MindFocusBooks-Portable-v0.0.93.exe` (Standalone single file, run immediately without installation)

          #### 📱 Android Edition
          - **Native APK**: `MindFocusBooks-Native.apk` (Signed standalone offline Android APK)

          #### ✨ Highlights
          - **Full Windows Desktop Application**: Offline Electron application with native window shortcuts, fullscreen mode (F11), zoom controls (Ctrl+/Ctrl-), and single-instance lock.
          - **Executive 3D Edit Studio**: 4 segmented luxury tabs, zero data clipping, auto end date calculation, real-time live preview.
          - **Activity Audit Log**: 100% interactive event history linked to books and filters.
          - **Seamless Offline Reading**: High-performance local storage persistence.
        files: ./artifacts/*
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
