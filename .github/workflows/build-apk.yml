name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Android Assets
      run: |
        mkdir -p android/app/src/main/assets
        cp index.html android/app/src/main/assets/
        cp style.css android/app/src/main/assets/
        cp app.js android/app/src/main/assets/
        cp books-data.js android/app/src/main/assets/
        cp broadcast-notice.json android/app/src/main/assets/ || true
        cp broadcast-notice.js android/app/src/main/assets/ || true
        cp icon-192.png android/app/src/main/assets/
        cp icon-512.png android/app/src/main/assets/
        cp jspdf.umd.min.js android/app/src/main/assets/
        cp jspdf.plugin.autotable.min.js android/app/src/main/assets/
        cp html2canvas.min.js android/app/src/main/assets/
        cp tesseract.min.js android/app/src/main/assets/

    - name: Ensure Permanent Keystore Exists
      working-directory: ./android/app
      run: |
        if [ ! -f "mindfocus.keystore" ]; then
          echo "Generating permanent release keystore..."
          keytool -genkeypair -v \
            -keystore mindfocus.keystore \
            -alias mindfocus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "mindfocus123" \
            -keypass "mindfocus123" \
            -dname "CN=MindFocus, OU=BooksTracker, O=MindFocus, L=Delhi, ST=DL, C=IN"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mindfocus.keystore
          git commit -m "Add permanent release keystore for seamless updates [skip ci]" || true
          git push origin main || true
        else
          echo "Permanent release keystore already present."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Standalone APK with Gradle
      working-directory: ./android
      run: |
        gradle assembleRelease --stacktrace --info

    - name: Locate and Rename APK
      run: |
        find android/app/build/outputs/apk/ -name "*.apk"
        cp $(find android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1) MindFocusBooks-Native.apk || cp $(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1) MindFocusBooks-Native.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MindFocusBooks-Native-APK
        path: MindFocusBooks-Native.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.0.9
        name: "Mind Focus Books Tracker v3.0.9 - Book Click Fix & Full Scrolling Detail Sheet"
        body: "Release v3.0.9: Fixed book click reference bug, restoring instant tap-to-open book detail sheet with full touch scrolling, compact reading progress, and accessible action buttons."
        files: MindFocusBooks-Native.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
