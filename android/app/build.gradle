plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mindfocus.bookstracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.mindfocus.bookstracker"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
